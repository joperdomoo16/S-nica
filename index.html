<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#050506">
  <meta name="description" content="Sónica - Plataforma de podcasts, series de audio y relatos inmersivos.">
  <title>Sónica</title>

  <!-- Google Fonts: Inter & Plus Jakarta Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

  <link rel="icon" type="image/png" href="/logo.png">
  <link rel="stylesheet" href="/src/index.css">
</head>
<body class="bg-[#050506] text-[#f0faff] font-sans antialiased overflow-x-hidden min-h-screen">
  <div class="atmosphere-bg"></div>

  <!-- Shell Wrapper -->
  <div id="app" class="min-h-screen flex flex-col">
    <!-- Top App Bar -->
    <header id="top-app-bar" class="fixed top-0 w-full z-50 glass-panel h-16 flex items-center justify-between px-6 shadow-[0_4px_30px_rgba(0,229,255,0.1)]">
      <div class="flex items-center gap-3">
        <button id="top-back-btn" class="p-2 rounded-full hover:bg-surface-container-high transition-colors text-primary active:scale-95 hidden">
          <!-- ArrowLeft icon injected -->
        </button>
        <h1 id="top-page-title" class="text-[17px] font-black font-headline tracking-tight bg-gradient-to-br from-[#00e5ff] to-[#004d40] bg-clip-text text-transparent">
          Sónica
        </h1>
      </div>

      <div class="flex items-center gap-3">
        <button id="top-notif-btn" class="p-2 rounded-full transition-all active:scale-95 relative text-primary hover:bg-surface-container-high">
          <!-- Bell icon injected -->
          <span id="top-notif-ping" class="absolute top-1.5 right-1.5 w-2 h-2 bg-cyan-500 rounded-full ring-2 ring-[#0a0a0b] animate-pulse shadow-[0_0_8px_rgba(34,211,238,0.8)] hidden"></span>
        </button>

        <div id="top-user-avatar-btn" class="w-10 h-10 rounded-full overflow-hidden border border-outline-variant/20 cursor-pointer active:scale-95 transition-transform bg-[#141418]">
          <img id="top-user-avatar-img" src="/Avatar/21.png" alt="User" class="w-full h-full object-cover">
        </div>
      </div>
    </header>

    <!-- Main Content Container -->
    <main id="app-view" class="flex-1 pt-16 pb-24"></main>

    <!-- Mini Player Component -->
    <div id="mini-player" class="fixed bottom-[96px] left-4 right-4 bg-[#1a1c23]/95 backdrop-blur-3xl rounded-[2rem] p-3 flex items-center gap-4 border border-white/10 shadow-[0_20px_50px_rgba(0,0,0,0.6)] z-[60] ring-1 ring-white/5 hidden">
      <div id="mini-track-click" class="flex-1 flex items-center gap-4 min-w-0 cursor-pointer">
        <div class="w-12 h-12 rounded-2xl overflow-hidden shadow-lg flex-shrink-0 border border-white/5 bg-surface-container-highest">
          <img id="mini-artwork" src="/logo.png" class="w-full h-full object-cover" alt="">
        </div>
        <div class="flex-1 min-w-0">
          <h4 id="mini-title" class="text-white font-black text-[13px] line-clamp-1 uppercase italic tracking-tight leading-tight">Título</h4>
          <p id="mini-series" class="text-primary text-[10px] font-black uppercase tracking-widest mt-0.5 opacity-80 line-clamp-1">Serie</p>
          <div class="w-full h-0.5 bg-white/10 rounded-full mt-1.5 overflow-hidden">
            <div id="mini-progress-fill" class="h-full bg-primary shadow-[0_0_8px_rgba(0,229,255,0.5)]" style="width: 0%"></div>
          </div>
        </div>
      </div>
      <div class="flex items-center gap-1.5 pr-1">
        <button id="mini-toggle-play" class="w-11 h-11 flex items-center justify-center rounded-full bg-primary/10 text-primary active:scale-90 transition-transform border border-primary/20">
          <!-- Play / Pause injected -->
        </button>
        <button id="mini-close" class="w-8 h-8 flex items-center justify-center rounded-full text-white/30 hover:text-white/60 active:scale-90 transition-all">
          <!-- X icon injected -->
        </button>
      </div>
    </div>

    <!-- Bottom Nav Bar -->
    <nav id="bottom-nav-bar" class="fixed bottom-0 left-0 w-full h-22 bg-[#050506] flex justify-center items-center pb-safe z-50 border-t border-white/5 px-4 shadow-[0_-10px_40px_rgba(0,0,0,0.6)]">
      <div id="bottom-nav-inner" class="flex justify-between items-center w-full max-w-[400px]">
        <!-- Rendered dynamically matching Layout.tsx -->
      </div>
    </nav>
  </div>

  <!-- Notification Center Drawer -->
  <div id="notif-center-overlay" class="fixed inset-0 z-[100] bg-black/60 backdrop-blur-sm hidden">
    <div id="notif-center-panel" class="absolute top-0 right-0 h-full w-full max-w-sm bg-[#0a0a0d] border-l border-white/10 p-6 flex flex-col shadow-2xl">
      <div class="flex items-center justify-between pb-4 border-b border-white/10 mb-4">
        <h3 class="font-headline font-black text-lg text-white uppercase italic">Notificaciones</h3>
        <button id="notif-close-btn" class="p-2 rounded-full hover:bg-white/10 text-white/60 hover:text-white transition-colors">
          <!-- X icon -->
        </button>
      </div>
      <div id="notif-items-list" class="flex-1 overflow-y-auto space-y-3 no-scrollbar"></div>
    </div>
  </div>

  <div id="toast-container" class="fixed bottom-28 right-6 z-[120] flex flex-col gap-2 pointer-events-none"></div>

  <script type="module" src="/src/js/main.js"></script>
</body>
</html>
